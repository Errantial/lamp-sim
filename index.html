<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discharge Lamps</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='7' fill='%23555'/%3E%3Ccircle cx='8' cy='8' r='3' fill='%23ffd54f'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/sim.css">
</head>
<body>
<div id="app">
  <div class="titlebar" data-i18n="title">Discharge Lamps</div>

  <nav class="menubar" aria-label="Main menu">
    <div class="menu">
      <button aria-haspopup="true" aria-expanded="false" data-i18n="menu.file">File</button>
      <ul role="menu"><li role="none"><button role="menuitem" id="mCopy" data-i18n="file.copylink">Copy Link to This Setup</button></li>
        <li role="none"><button role="menuitem" id="mReset" data-i18n="file.reset">Reset All</button></li></ul>
    </div>
    <div class="menu">
      <button aria-haspopup="true" aria-expanded="false" data-i18n="menu.options">Options</button>
      <ul role="menu" id="optMenu">
        <li role="none"><button role="menuitem" id="mSpeed" data-i18n="options.speed">Simulation Speed…</button></li>
        <li class="sep" role="separator"></li>
      </ul>
    </div>
    <div class="menu">
      <button aria-haspopup="true" aria-expanded="false" data-i18n="menu.help">Help</button>
      <ul role="menu"><li role="none"><button role="menuitem" id="mAbout" data-i18n="help.about">About…</button></li></ul>
    </div>
  </nav>

  <div class="tabs" role="tablist">
    <button role="tab" id="tabSingle" aria-selected="false" data-i18n="tab.single">One Atom</button>
    <button role="tab" id="tabMultiple" aria-selected="true" data-i18n="tab.multiple">Multiple Atoms</button>
  </div>

  <div class="main">
    <div class="stagewrap"><div class="stagebox">
      <canvas id="stage" width="710" height="640" role="img" aria-label="Discharge tube with atoms, electrons and photons"></canvas>

      <div class="ov battery-ov">
        <input id="volt" type="range" min="-30" max="30" step="0.25" value="23" data-i18n-aria="battery.label">
        <input id="voltText" type="text" inputmode="decimal" value="23.00 V" data-i18n-aria="battery.value">
      </div>

      <div class="ov epanel" role="group" aria-labelledby="epTitle">
        <div class="title" id="epTitle" data-i18n="electron.title">Electron Production</div>
        <div class="row">
          <label><input type="radio" name="mode" value="single"> <span data-i18n="electron.single">Single</span></label>
          <label><input type="radio" name="mode" value="continuous" checked> <span data-i18n="electron.continuous">Continuous</span></label>
          <button id="fire" type="button" data-i18n="electron.fire">Fire electron</button>
          <input id="pct" type="range" min="0" max="100" step="1" value="20" data-i18n-aria="electron.rate">
          <input id="pctText" type="text" inputmode="numeric" value="20%" aria-label="Electron production percent">
        </div>
      </div>

      <div class="ov specbtns" id="specBtns">
        <button class="specbtn" id="sStop" type="button" data-i18n="spec.stop">Stop</button>
        <button class="specbtn" id="sReset" type="button" data-i18n="spec.reset">Reset</button>
      </div>
      <div id="tip" role="status"></div>
    </div>
    <div class="bottombar">
        <button id="lampsBtn" type="button" class="actualbtn" data-i18n="lamps.button">See How the Lamps Glow</button>
        <button id="clockPause" type="button" class="roundbtn blue" data-i18n-title="clock.pause" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><g id="pauseIcon"><rect x="6" y="5" width="4" height="14"/><rect x="14" y="5" width="4" height="14"/></g><path id="playIcon" d="M8 5l11 7-11 7z" hidden/></svg></button>
        <button id="clockStep" type="button" class="roundbtn" data-i18n-title="clock.step" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="3" height="14"/><path d="M10 5l9 7-9 7z"/></svg></button>
    </div>
    </div>

    <aside class="panel">
      <h2 data-i18n="legend.title">Legend</h2>
      <div class="legend">
        <canvas id="lgAtom" width="60" height="28"></canvas><span data-i18n="legend.atom">Atom</span>
        <canvas id="lgElectron" width="60" height="28"></canvas><span data-i18n="legend.electron">Electron</span>
        <canvas id="lgPhoton" width="60" height="28"></canvas><span data-i18n="legend.photon">Photon</span>
      </div>
      <h2 data-i18n="atomtype.title">Atom Type</h2>
      <div class="atomtype">
        <select id="element" aria-label="Atom type"></select>
        <div id="levelsRow"><label for="nLevels" data-i18n="atomtype.levels">Number of levels</label>
          <select id="nLevels"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option></select></div>
      </div>
      <canvas id="energy" width="300" height="340" role="img" aria-label="Energy level diagram"></canvas>
      <details id="analysis" class="analysis">
        <summary data-i18n="analysis.title">Analysis</summary>
        <canvas id="hist" width="300" height="140" role="img" aria-label="Histogram of electron energy at collision"></canvas>
        <canvas id="eff" width="300" height="96" role="img" aria-label="Share of electron energy converted to light"></canvas>
        <button id="statsReset" type="button" class="specbtn" data-i18n="analysis.reset">Reset statistics</button>
      </details>
      <h2 data-i18n="options.title">Options</h2>
      <div class="options">
        <label><input type="checkbox" id="optSpec" checked> <span data-i18n="options.spectrometer">Spectrometer</span></label>
        <label><input type="checkbox" id="optSquig"> <span data-i18n="options.squiggles">Squiggles</span></label>
        <label><input type="checkbox" id="optLines"> <span data-i18n="options.lines">Show line positions</span></label>
        <label><input type="checkbox" id="optSlow"> <span data-i18n="options.slow">Run in slow motion</span></label>
        <label class="atoms-row" id="atomsRow"><span><span data-i18n="options.atoms">Number of atoms</span>: <output id="nOut">30</output></span>
          <input type="range" id="natoms" min="1" max="30" step="1" value="30"></label>
      </div>
    </aside>
  </div>
</div>

<div id="live" class="sr-only" aria-live="polite"></div>
<div id="toast" role="status" hidden></div>

<dialog id="speedDlg" aria-labelledby="speedTitle">
  <h3 id="speedTitle" data-i18n="speed.title">Simulation Speed</h3>
  <div class="row"><label for="dt" data-i18n="speed.label">Time step per tick</label>
    <input type="range" id="dt" min="1" max="15" step="1" value="12"><output id="dtOut">12</output></div>
  <form method="dialog"><button data-i18n="close">Close</button></form>
</dialog>
<dialog id="lampsDlg" aria-labelledby="lampsTitle">
  <h3 id="lampsTitle" data-i18n="lamps.title">How the lamps glow</h3>
  <canvas id="lampCanvas" width="440" height="270" role="img" aria-label="Simulated glow colour of each gas"></canvas>
  <p class="credit" data-i18n="lamps.note"></p>
  <form method="dialog"><button data-i18n="close">Close</button></form>
</dialog>
<dialog id="aboutDlg" aria-labelledby="aboutTitle">
  <h3 id="aboutTitle" data-i18n="about.title">About</h3>
  <p data-i18n="about.body"></p>
  <p id="seedInfo" hidden></p>
  <form method="dialog"><button data-i18n="close">Close</button></form>
</dialog>

<script src="js/elements.js"></script>
<script src="js/model.js"></script>
<script src="js/i18n.js"></script>
<script src="js/view.js"></script>
<script src="js/main.js"></script>
</body>
</html>
